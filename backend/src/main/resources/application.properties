spring.application.name=poteryashki
spring.main.web-application-type=${APP_WEB_TYPE:servlet}
server.address=${APP_BIND:127.0.0.1}
server.port=${APP_PORT:18081}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.thymeleaf.cache=${TEMPLATE_CACHE:true}
app.cookie-secure=${COOKIE_SECURE:false}
app.jwt-secret=${JWT_SECRET:}
app.storage-root=${STORAGE_ROOT:./data/objects}
app.mail-mode=${MAIL_MODE:demo}
app.mail-host=${MAIL_HOST:}
app.mail-port=${MAIL_PORT:587}
app.mail-user=${MAIL_USER:}
app.mail-password=${MAIL_PASSWORD:}
app.mail-from=${MAIL_FROM:poteryashki@example.invalid}
app.public-url=${PUBLIC_URL:http://127.0.0.1:18081}
app.demo-payments=${DEMO_PAYMENTS:true}
app.jobs-enabled=${JOBS_ENABLED:true}
spring.datasource.url=${DB_URL:jdbc:postgresql://pg:5432/studs?currentSchema=s465826}
spring.datasource.username=${DB_USER:s465826}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.naming.physical-strategy=ru.itmo.is.poteryashki.persistence.TableNamingStrategy
spring.jpa.properties.hibernate.lf_prefix=${DB_PREFIX:lf_}
app.table-prefix=${DB_PREFIX:lf_}
app.demo=${APP_DEMO:false}
logging.level.org.hibernate=warn
