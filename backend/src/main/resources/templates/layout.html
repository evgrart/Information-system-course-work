<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:fragment="shell(title, content)">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${title} + ' · Потеряшки'">Потеряшки</title><link rel="stylesheet" th:href="@{/assets/app.css}"></head>
<body><header class="header"><div class="wrap header-inner"><a class="brand" th:href="@{/}"><span class="brand-mark">П</span>потеряшки<span class="brand-city">Санкт-Петербург</span></a><nav aria-label="Главная навигация"><a th:href="@{/catalog}">Каталог</a><a th:href="@{/metro}">Потеряли в метро?</a><a th:if="${me != null}" th:href="@{/auctions}">Аукционы</a><a th:if="${me == null}" class="button small" th:href="@{/auth/login}">Войти</a><a th:if="${me != null}" class="button small" th:href="@{/account}">Личный кабинет</a></nav></div></header>
<div class="wrap workspace"><aside th:if="${me != null}" class="sidebar"><span class="eyebrow">Мой профиль</span><strong th:text="${profile != null ? profile.display_name : 'Личный кабинет'}"></strong><a th:href="@{/account}" th:classappend="${path == '/account'} ? 'selected'">Обзор</a><a th:href="@{/listings/new}">Добавить объявление</a><a th:href="@{/claims}">Заявки и диалоги</a><a th:href="@{/subscriptions}">Подписка</a><a th:href="@{/account/mail}">Письма</a><a th:if="${me.moderator()}" th:href="@{/staff}">Модерация</a><a th:if="${me.admin()}" th:href="@{/admin}">Управление</a><form method="post" th:action="@{/auth/logout}"><button class="quiet" type="submit">Выйти</button></form></aside><div class="page" th:classappend="${me == null} ? 'full'"><th:block th:replace="${content}"/></div></div>
<footer class="wrap footer"><span>Потеряшки · Помогаем вещам вернуться домой</span><a th:href="@{/metro}">Контакты метрополитена</a></footer></body></html>
