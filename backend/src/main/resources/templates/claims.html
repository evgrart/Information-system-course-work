<!doctype html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell('Заявки и диалоги', ~{::main})}"><main><span class="eyebrow">Возврат вещей</span><h1>Заявки и диалоги</h1><p class="lead">Проверьте приметы и согласуйте встречу. Подтверждайте передачу после получения вещи.</p><div class="empty panel" th:if="${claims.isEmpty()}"><h2>Заявок пока нет</h2><a th:href="@{/catalog}">Посмотреть находки →</a></div><article class="panel" th:each="c : ${claims}"><div class="section-heading"><div><span class="eyebrow" th:text="${c.author_id == me.userId() ? 'Входящая заявка' : 'Моя заявка'}"></span><h2 th:text="${c.title}"></h2></div><span class="badge" th:text="${@ui.state(c.state)}"></span></div><p th:if="${c.auction_id != null}" th:text="${'Передача по результатам аукциона №' + c.auction_id}"></p><p class="preline" th:text="${c.evidence}"></p><div class="actions"><a class="button secondary" th:href="@{/conversations/{id}(id=${c.conversation_id})}">Открыть диалог</a><form th:if="${c.state == 'pending' and c.author_id == me.userId()}" method="post" th:action="@{/claims/{id}/reserve(id=${c.id})}"><button>Согласовать возврат</button></form><form th:if="${c.state == 'pending' and c.author_id == me.userId()}" method="post" th:action="@{/claims/{id}/reject(id=${c.id})}"><button class="danger">Отклонить</button></form><form th:if="${(c.state == 'pending' or (c.state == 'accepted' and c.auction_id == null and c.finder_confirmed_at == null and c.owner_confirmed_at == null)) and c.claimant_id == me.userId()}" method="post" th:action="@{/claims/{id}/cancel(id=${c.id})}"><button class="danger">Отменить заявку</button></form></div><div th:if="${c.transfer_id != null}" class="notice"><p th:text="${'Нашедший: ' + (c.finder_confirmed_at != null ? 'подтвердил' : 'ожидается подтверждение') + ' · Владелец: ' + (c.owner_confirmed_at != null ? 'подтвердил' : 'ожидается подтверждение')}"></p><form th:if="${c.state == 'accepted'}" method="post" th:action="@{/transfers/{id}/confirm(id=${c.transfer_id})}"><button>Подтвердить передачу вещи</button></form><p th:if="${c.completed_at != null}" th:text="${'Передача завершена: ' + @ui.date(c.completed_at)}"></p></div></article></main></html>
