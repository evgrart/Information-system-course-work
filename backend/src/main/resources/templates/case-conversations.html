<!doctype html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell('Материалы жалобы', ~{::main})}"><main><a class="back" th:href="@{/staff(tab='complaints')}">← Жалобы</a><h1>Диалоги по открытому делу</h1><p class="notice">Доступ сотрудника действует только пока жалоба рассматривается. После закрытия дела доступ к чужому диалогу прекращается.</p><p th:if="${conversations.isEmpty()}">Нет доступных диалогов по этой жалобе.</p><article class="panel" th:each="c : ${conversations}"><p th:text="${c.evidence}"></p><a class="button secondary" th:href="@{/conversations/{id}(id=${c.id})}">Открыть диалог</a></article></main></html>
