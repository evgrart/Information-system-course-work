<!doctype html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell('Письма', ~{::main})}"><main><span class="eyebrow">Личный кабинет</span><h1>Письма</h1><div class="notice" th:if="${demoMail}">Учебная почта: письма доступны только получателю в этом аккаунте. Они не отправляются на внешний адрес и исчезают после перезапуска сервера.</div><p th:unless="${demoMail}">Письма отправляются на вашу электронную почту.</p><p class="empty" th:if="${letters.isEmpty()}">Писем пока нет.</p><article class="panel" th:each="letter : ${letters}"><h2 th:text="${letter.subject}"></h2><p th:text="${letter.text}"></p><a class="button secondary" th:href="${letter.link}">Открыть письмо →</a></article></main></html>
