<!doctype html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell('Объявление', ~{::main})}"><main><span class="eyebrow">Мои вещи</span><h1 th:text="${item.id == null ? 'Новое объявление' : 'Редактировать объявление'}"></h1><div class="notice" th:unless="${paid}">Для создания и изменения нужна подписка. <a th:href="@{/subscriptions}">Оформить доступ</a></div><span class="badge" th:if="${item.state != null}" th:text="${@ui.state(item.state)}"></span>
<form class="panel stack" method="post" th:action="${item.id == null} ? @{/listings} : @{/listings/{id}/edit(id=${item.id})}"><div class="grid"><label>Тип<select name="kind"><option value="found" th:selected="${item.kind == 'found'}">Я нашёл вещь</option><option value="lost" th:selected="${item.kind == 'lost'}">Я потерял вещь</option></select><span th:if="${item.id != null}" class="hint">Тип существующего объявления изменить нельзя.</span></label><label>Категория<select name="category" required><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${item.category_id == c.id}"></option></select></label></div><label>Название<input name="title" th:value="${item.title}" maxlength="120" placeholder="Например, чёрный складной зонт" required></label><label>Описание<textarea name="description" th:text="${item.description}" maxlength="10000" required rows="5"></textarea><span class="hint">Уникальные приметы сохраните отдельно, чтобы проверить владельца.</span></label><label>Место<select name="location" required><option th:each="l : ${locations}" th:value="${l.id}" th:text="${l.name}" th:selected="${item.location_id == l.id}"></option></select></label><div class="grid"><label>Дата и время<input type="datetime-local" name="eventAt" th:value="${item.event_at != null ? @ui.inputDate(item.event_at) : ''}" required><span class="hint">По времени Санкт-Петербурга.</span></label><label>Конец интервала, если известен<input type="datetime-local" name="eventUntil" th:value="${item.event_until != null ? @ui.inputDate(item.event_until) : ''}"></label></div><details><summary>Хранение в организации и официальное заявление</summary><div class="stack"><label>Организация-хранитель<select name="custodian"><option value="">Храню самостоятельно</option><option th:each="o : ${organizations}" th:value="${o.id}" th:text="${o.name}" th:selected="${item.custodian_org_id == o.id}"></option></select></label><label>Дата официального сообщения о находке<input type="datetime-local" name="officialAt" th:value="${item.official_reported_at != null ? @ui.inputDate(item.official_reported_at) : ''}"></label><p class="hint">Публикация в приложении не заменяет обращение в уполномоченную организацию.</p></div></details><button th:disabled="${!paid}">Сохранить черновик</button></form>
<th:block th:if="${item.id != null}"><section class="panel"><h2>Особые приметы</h2><p>Видны только вам. Не размещайте здесь пароли или документы целиком.</p><dl th:each="a : ${attributes}"><dt th:text="${a.name}"></dt><dd th:text="${a.value}"></dd></dl><form class="stack" method="post" th:action="@{/listings/{id}/attributes(id=${item.id})}"><label>Название приметы<input name="name" maxlength="120" required></label><label>Значение<input name="value" maxlength="4000" required></label><button class="secondary">Добавить примету</button></form></section><section class="panel"><h2>Фотографии</h2><div class="photo-strip"><img th:each="p : ${photos}" th:src="@{/media/photos/{id}(id=${p.id})}" alt="Фото объявления"></div><form class="stack" method="post" enctype="multipart/form-data" th:action="@{/listings/{id}/photos(id=${item.id})}"><label>Файл<input name="file" type="file" accept="image/jpeg,image/png" required><span class="hint">JPEG или PNG до 5 МБ, до 16 миллионов пикселей. До пяти фотографий.</span></label><label>Позиция<input type="number" name="position" min="1" max="5" value="1" required></label><button class="secondary">Загрузить фото</button></form></section><div class="actions"><form th:if="${item.state == 'draft' or item.state == 'rejected'}" method="post" th:action="@{/listings/{id}/submit(id=${item.id})}"><button>Отправить на модерацию</button></form><form th:if="${item.state == 'draft' or item.state == 'pending' or item.state == 'published' or item.state == 'rejected'}" method="post" th:action="@{/listings/{id}/archive(id=${item.id})}"><button class="danger">Снять объявление</button></form></div></th:block>
</main></html>
