<!doctype html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell(${auction.title}, ~{::main})}"><main><a class="back" th:href="@{/auctions}">← Аукционы</a><span class="badge" th:text="${@ui.state(auction.state)}"></span><h1 th:text="${auction.title}"></h1><p class="lead preline" th:text="${auction.description}"></p><section class="panel"><dl><dt>Начальная цена</dt><dd th:text="${auction.start_price + ' ₽'}"></dd><dt>Текущая ставка</dt><dd th:text="${auction.highest_bid != null ? auction.highest_bid + ' ₽' : 'Ставок пока нет'}"></dd><dt>Шаг</dt><dd th:text="${auction.bid_step + ' ₽'}"></dd><dt>Начало</dt><dd th:text="${@ui.date(auction.starts_at)}"></dd><dt>Окончание</dt><dd th:text="${@ui.date(auction.ends_at)}"></dd></dl><div class="notice" th:if="${auction.state == 'finished'}" th:text="${auction.winner_id == null ? 'Аукцион завершён без победителя.' : auction.winner_id == me.userId() ? 'Ваша ставка выиграла. Перейдите к заявкам для согласования передачи.' : 'Победитель определён.'}"></div><a th:if="${auction.state == 'finished' and (auction.winner_id == me.userId() or auction.seller_id == me.userId())}" class="button" th:href="@{/claims}">Согласовать передачу</a><form th:if="${(auction.state == 'active' or auction.state == 'scheduled') and auction.seller_id != me.userId()}" method="post" class="stack" th:action="@{/auctions/{id}/bids(id=${auction.id})}"><input type="hidden" name="key" th:value="${key}"><label>Ваша ставка, ₽<input type="number" name="amount" step="0.01" th:min="${auction.highest_bid != null ? auction.highest_bid + auction.bid_step : auction.start_price}" required></label><p class="hint">Ставка принимается в период торгов. Перед отправкой проверьте сумму.</p><button>Сделать ставку</button></form><form th:if="${me.moderator()}" method="post" th:action="@{/staff/auctions/{id}/close(id=${auction.id})}"><button class="secondary">Завершить истёкшие торги</button></form></section></main></html>
