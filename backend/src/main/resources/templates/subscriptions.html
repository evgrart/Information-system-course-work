<!doctype html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell('Подписка', ~{::main})}"><main><span class="eyebrow">Доступ к сервису</span><h1>Подписка</h1><p class="lead">Проверенный профиль и подписка открывают каталог, публикации и участие в аукционах.</p><div class="notice" th:if="${demoPayments}">Учебная оплата. Средства не списываются.</div><div class="notice" th:if="${profile.state != 'verified' or profile.email_confirmed_at == null}">Сначала подтвердите почту и дождитесь одобрения профиля модератором.</div><div class="grid"><article class="panel tariff" th:each="t : ${tariffs}"><span class="eyebrow" th:text="${t.duration_days + ' дней'}"></span><h2 th:text="${t.title}"></h2><p class="price" th:text="${t.amount + ' ₽'}"></p><form method="post" th:action="@{/subscriptions/orders}"><input type="hidden" name="tariff" th:value="${t.id}"><input type="hidden" name="key" th:value="${key}"><button th:disabled="${profile.state != 'verified' or profile.email_confirmed_at == null}">Создать заказ</button></form></article></div><h2>Мои заказы</h2><p th:if="${orders.isEmpty()}" class="muted">Вы ещё не оформляли заказы.</p><article class="list-row" th:each="o : ${orders}"><div><h3 th:text="${o.title}"></h3><span th:text="${o.amount + ' ₽ · ' + @ui.state(o.state)}"></span></div><form th:if="${o.state == 'created' and demoPayments}" method="post" th:action="@{/subscriptions/orders/{id}/pay(id=${o.id})}"><input type="hidden" name="event" th:value="${event}"><button>Оплатить в учебном режиме</button></form></article></main></html>
