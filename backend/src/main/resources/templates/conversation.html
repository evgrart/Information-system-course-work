<!doctype html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell('Диалог о возврате', ~{::main})}"><main><a class="back" th:href="@{/claims}">← Все заявки</a><h1 th:text="${conversation.title}"></h1><span class="badge" th:text="${@ui.state(conversation.state)}"></span><div class="notice"><strong>Приметы от заявителя</strong><p class="preline" th:text="${conversation.evidence}"></p></div><section class="panel chat"><p class="muted" th:if="${messages.isEmpty()}">Начните диалог: уточните приметы или место встречи.</p><article class="message" th:each="msg : ${messages}" th:classappend="${msg.sender_id == me.userId()} ? 'mine'"><span class="eyebrow" th:text="${msg.sender_id == me.userId() ? 'Вы' : 'Собеседник'}"></span><p class="preline" th:text="${msg.body}"></p><span class="muted" th:text="${@ui.date(msg.sent_at)}"></span></article><form class="stack" method="post" th:action="@{/conversations/{id}/messages(id=${conversation.id})}"><label>Сообщение<textarea name="body" maxlength="4000" rows="3" required></textarea></label><button>Отправить</button></form></section><details class="panel"><summary>Возник спор?</summary><form class="stack" method="post" th:action="@{/complaints}"><input type="hidden" name="user" th:value="${conversation.author_id == me.userId() ? conversation.claimant_id : conversation.author_id}"><label>Что произошло<textarea name="reason" required maxlength="10000"></textarea></label><button class="secondary">Сообщить модератору</button></form></details></main></html>
