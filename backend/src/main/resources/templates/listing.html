<!doctype html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell(${item.title}, ~{::main})}"><main><a class="back" th:href="@{/catalog}">← Каталог</a><span class="tag" th:text="${@ui.kind(item.kind)}"></span><h1 th:text="${item.title}"></h1><div class="actions"><span class="badge" th:text="${@ui.state(item.state)}"></span><span class="muted" th:text="${item.category}"></span></div><div class="photo-strip" th:if="${!photos.isEmpty()}"><img th:each="p : ${photos}" th:src="@{/media/photos/{id}(id=${p.id})}" th:alt="${item.title}"></div><section class="panel"><dl><dt>Место</dt><dd th:text="${item.city + ', ' + item.place}"></dd><dt>Время</dt><dd th:text="${@ui.date(item.event_at)}"></dd><dt th:if="${item.metro_station != null}">Станция метро</dt><dd th:if="${item.metro_station != null}" th:text="${item.metro_station}"></dd></dl><h2>Описание</h2><p class="preline" th:text="${item.description}"></p></section>
<section th:if="${item.custodian != null}" class="panel"><h2 th:text="${item.custodian}"></h2><p class="preline" th:text="${item.instructions}"></p><p th:text="${'Телефон: ' + item.phone}"></p><a th:href="${item.source_url}" rel="noreferrer">Официальная инструкция ↗</a><p class="muted">Решение о выдаче принимает организация.</p></section>
<section th:if="${item.kind == 'found' and item.custodian == null and item.state == 'published'}" class="panel"><h2>Это ваша вещь?</h2><p>Опишите непубличные приметы, содержимое или другие доказательства. Сообщение увидит автор находки.</p><form class="stack" method="post" th:action="@{/listings/{id}/claims(id=${item.id})}"><label>Доказательства<textarea name="evidence" maxlength="10000" required rows="4"></textarea></label><button>Подать заявку на возврат</button></form></section>
<details class="panel"><summary>Сообщить о проблеме</summary><form class="stack" method="post" th:action="@{/complaints}"><input type="hidden" name="listing" th:value="${item.id}"><label>Причина жалобы<textarea name="reason" maxlength="10000" required></textarea></label><button class="secondary">Отправить модератору</button></form></details>
</main></html>
