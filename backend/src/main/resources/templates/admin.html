<!doctype html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell('Управление', ~{::main})}"><main><span class="eyebrow">Администратор</span><h1>Управление сервисом</h1><h2>Пользователи и роли</h2><article class="panel" th:each="u : ${users}"><div class="section-heading"><h3 th:text="${u.display_name + ' · №' + u.id}"></h3><span class="badge" th:text="${@ui.state(u.state)}"></span></div><p th:text="${u.email}"></p><p th:text="${'Роли: ' + u.roles}"></p><details><summary>Изменить права доступа</summary><form class="stack" method="post" th:action="@{/admin/users/{id}/roles(id=${u.id})}"><label>Роль<select name="role"><option value="user">Пользователь</option><option value="moderator">Модератор</option><option value="admin">Администратор</option></select></label><label>Причина<textarea name="reason" maxlength="4000" required></textarea></label><div class="actions"><button name="grant" value="true">Назначить</button><button class="danger" name="grant" value="false">Снять роль</button></div></form><form class="stack" method="post" th:action="@{/staff/users/{id}/block(id=${u.id})}"><label>Причина блокировки<textarea name="reason" required></textarea></label><button class="danger">Заблокировать</button></form></details></article><h2>Тарифы</h2><article class="list-row" th:each="t : ${tariffs}"><div><h3 th:text="${t.title}"></h3><p th:text="${t.amount + ' ₽ · ' + t.duration_days + ' дней · ' + (t.active ? 'Действует' : 'Закрыт')}"></p></div><form th:if="${t.active}" method="post" th:action="@{/admin/tariffs/{id}/retire(id=${t.id})}"><button class="secondary">Закрыть для новых заказов</button></form></article><details class="panel"><summary>Добавить тариф</summary><form class="stack" method="post" th:action="@{/admin/tariffs}"><label>Название<input name="title" maxlength="120" required></label><div class="grid"><label>Стоимость, ₽<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Длительность, дней<input name="days" type="number" min="1" required></label></div><button>Создать тариф</button></form></details><h2>Контакты организаций</h2><article class="panel" th:each="o : ${organizations}"><h3 th:text="${o.name}"></h3><form class="stack" method="post" th:action="@{/admin/organizations/{id}(id=${o.id})}"><label>Телефон<input name="phone" th:value="${o.phone}" required></label><label>Адрес<input name="address" th:value="${o.address}" required></label><label>Инструкция<textarea name="instructions" th:text="${o.instructions}" required rows="5"></textarea></label><label>Официальный источник<input name="source" type="url" th:value="${o.source_url}" required></label><label>Дата проверки<input name="checked" type="date" th:value="${o.verified_on}" required></label><button>Обновить сведения</button></form></article></main></html>
