<!doctype html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: shell('Каталог вещей', ~{::main})}"><main><div class="section-heading"><div><span class="eyebrow">Ищем в Санкт-Петербурге</span><h1>Каталог вещей</h1></div><a class="button secondary" th:href="@{/listings/new}">Добавить объявление</a></div>
<form method="get" th:action="@{/catalog}" class="filters panel"><label class="wide">Что вы ищете?<input name="text" th:value="${param.text}" placeholder="Например, зонт или ключи" maxlength="200"></label><label>Тип<select name="kind"><option value="">Все объявления</option><option value="found" th:selected="${param.kind != null and param.kind[0] == 'found'}">Найдено</option><option value="lost" th:selected="${param.kind != null and param.kind[0] == 'lost'}">Потеряно</option></select></label><label>Категория<select name="category"><option value="">Все категории</option><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${param.category != null and param.category[0] == c.id.toString()}"></option></select></label><label>Место<select name="location"><option value="">Любое место</option><option th:each="l : ${locations}" th:value="${l.id}" th:text="${l.name}" th:selected="${param.location != null and param.location[0] == l.id.toString()}"></option></select></label><details class="wide"><summary>Интервал времени</summary><div class="grid"><label>С<input type="datetime-local" name="from" th:value="${param.from}"></label><label>По<input type="datetime-local" name="to" th:value="${param.to}"></label></div></details><button>Найти</button><a th:href="@{/catalog}">Сбросить</a></form>
<div class="section-heading"><h2>Объявления</h2><span class="muted" th:text="${listings.size() + ' на этой странице'}"></span></div><div th:if="${listings.isEmpty()}" class="panel empty"><h3>Совпадений пока нет</h3><p>Попробуйте изменить место, время или описание.</p></div><div class="grid cards"><article class="card" th:each="l : ${listings}"><a class="card-picture" th:href="@{/listings/{id}(id=${l.id})}"><img th:if="${l.photo_id != null}" th:src="@{/media/photos/{id}(id=${l.photo_id})}" th:alt="${l.title}"><span th:if="${l.photo_id == null}" class="placeholder-symbol" aria-hidden="true">⌕</span><span class="tag" th:text="${@ui.kind(l.kind)}"></span></a><div class="card-body"><span class="muted" th:text="${l.category}"></span><h3><a th:href="@{/listings/{id}(id=${l.id})}" th:text="${l.title}"></a></h3><p th:text="${l.place}"></p><span class="muted" th:text="${@ui.date(l.event_at)}"></span></div></article></div><a th:if="${next != null}" class="button secondary" th:href="@{/catalog(cursor=${next},text=${param.text},kind=${param.kind},category=${param.category},location=${param.location},from=${param.from},to=${param.to})}">Следующие объявления →</a>
</main></html>
